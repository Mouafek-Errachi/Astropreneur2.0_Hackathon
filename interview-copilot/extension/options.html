<!doctype html>
<meta charset="utf-8">
<title>Interview Copilot settings</title>
<style>
  body{font:14px system-ui,sans-serif;max-width:480px;margin:32px auto;padding:0 16px}
  label{display:block;margin:16px 0 4px;font-weight:600}
  input{width:100%;padding:8px;box-sizing:border-box}
  button{margin-top:16px;padding:8px 16px}
</style>
<h2>Interview Copilot</h2>
<label for="url">Backend URL</label>
<input id="url" placeholder="http://localhost:8010">
<label for="tok">HR platform token (JWT)</label>
<input id="tok" type="password">
<button id="save">Save</button> <span id="ok"></span>
<hr>
<label>Microphone</label>
<p>Allow once so the copilot can hear you during calls.</p>
<button id="mic">Allow microphone</button> <span id="micOk"></span>
<script src="options.js"></script>
